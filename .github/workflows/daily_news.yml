name: Daily Financial News Digest

on:
  schedule:
    # 06:30 UTC = 09:30 AM Africa/Cairo time (UTC+3)
    # Runs automatically every day
    - cron: '30 6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab anytime

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Agent Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_CLASSIFY_MODEL: ${{ vars.GEMINI_CLASSIFY_MODEL || 'gemini-3.6-flash' }}
          GEMINI_SUMMARIZE_MODEL: ${{ vars.GEMINI_SUMMARIZE_MODEL || 'gemini-3.6-flash' }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'power_automate' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'toka.ibrahim@Drive-Finance.Com' }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || 'toka.ibrahim@Drive-Finance.Com' }}
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
          SCHEDULE_FREQUENCY: daily
          SCHEDULE_TIME: "09:30"
          TIMEZONE: "Africa/Cairo"
          OVERLAP_HOURS: "2"
          INITIAL_LOOKBACK_HOURS: "24"
          IMPORTANCE_THRESHOLD: "60"
          NO_NEWS_BEHAVIOUR: "skip"
          ENVIRONMENT: "production"
        run: |
          python app/main.py --run-now
