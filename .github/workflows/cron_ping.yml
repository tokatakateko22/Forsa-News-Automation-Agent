name: Cron Scheduler Heartbeat Test

on:
  schedule:
    # Run at off-peak minutes (:03, :18, :33, :48)
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Report Trigger Time
        run: |
          UTC_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          MSG="GitHub Actions cron scheduler triggered successfully at ${UTC_TIME}"
          echo "$MSG"
          echo "### 🕒 Cron Scheduler Heartbeat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Active" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time:** \`${UTC_TIME}\`" >> $GITHUB_STEP_SUMMARY
